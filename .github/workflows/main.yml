name: Scraper

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # every 5 minutes, offset by 2 minutes (UTC)
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore seen listings cache
        uses: actions/cache/restore@v4
        with:
          path: seen_listings.json
          key: seen-listings-${{ github.run_id }}
          restore-keys: |
            seen-listings-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract scraper files
        run: unzip -q -o scraper.zip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python car_scraper.py

      - name: Save seen listings cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_listings.json
          key: seen-listings-${{ github.run_id }}

      - name: Commit seen listings to repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json
          git diff --staged --quiet || (git commit -m "Update seen listings [skip ci]" && git push)
